name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild (e.g., v0.2.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Verify tag matches main.version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag#v}"
          gover="$(grep -oE 'var version = "[^"]+"' main.go | grep -oE '"[^"]+"' | tr -d '\"')"
          echo "tag=$tag goversion=$gover"
          if [[ "$tag" != "$gover" ]]; then
            echo "::error::tag ($tag) != main.version ($gover)"
            exit 1
          fi

      - name: Build binary
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist/ytt
          # CGO_ENABLED=0 gives a static binary and makes every target
          # cross-compilable; ytt has no C dependencies.
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$version" -o dist/ytt/ytt .
          ./dist/ytt/ytt --version

      - name: Bundle playlist-ingest scripts
        shell: bash
        run: |
          # `ytt ingest` resolves scripts/ relative to the binary at runtime,
          # so the bash workflow has to ship alongside it inside the tarball.
          cp -R scripts dist/ytt/scripts

      - name: Package tarball
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          name="ytt-${version}-${{ matrix.target }}"
          # Tarball contents are the *contents* of dist/ytt — the `ytt` binary
          # at the root plus the bundled `scripts/` tree. There is no longer an
          # `_internal` directory: the Go build is a single static binary, where
          # the PyInstaller --onedir bundle needed its interpreter and deps
          # shipped alongside. The formula still moves everything into libexec
          # and symlinks the binary into bin.
          tar -C dist/ytt -czf "${name}.tar.gz" .
          shasum -a 256 "${name}.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" ytt-*.tar.gz --repo "${{ github.repository }}" --clobber

  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: marcelocantos
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          version: ${{ github.event.release.tag_name || inputs.tag }}
          install: |
            libexec.install Dir["*"]
            bin.install_symlink libexec/"ytt"
          # coreutils supplies gtimeout, which with_timeout() needs. macOS has no
          # GNU timeout, and without it every per-call timeout AND the run
          # watchdog silently become no-ops — the exact failure mode those
          # timeouts exist to prevent (a stalled call wedging the run, and thus
          # every future scheduled run).
          # blurter is a hard dependency: ytt reports notification events to it
          # and has no notifier of its own. Declaring it means `brew install
          # ytt` yields a working alerting path rather than one that silently
          # does nothing.
          depends_on: |
            "yt-dlp"
            "jq"
            "yq"
            "coreutils"
            "marcelocantos/tap/blurter"
          test: 'assert_match "ytt #{version}", shell_output("#{bin}/ytt --version")'
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          skip_checksum: true
          update_readme_table: true
