name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go:
    name: Go ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race
      - name: build
        run: go build -o ytt .

      # The CLI contract from ~/.claude/conventions.md. These ran as a Python
      # matrix before; the binary has no interpreter to matrix over, so they run
      # once per OS instead.
      - name: --version
        run: |
          out="$(./ytt --version)"; echo "$out"; [[ "$out" == ytt* ]]
      - name: --help
        run: ./ytt --help
      - name: --help-agent
        run: |
          out="$(./ytt --help-agent)"
          [[ "$out" == *"ytt"* && "$out" == *"Exit codes"* ]]
      - name: no-args exits 2
        run: |
          set +e; ./ytt; rc=$?; set -e; [[ $rc -eq 2 ]]

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/playlist-ingest/ingest.sh
          bash -n scripts/playlist-ingest/ingest-one.sh
          bash -n scripts/playlist-ingest/build-index.sh
      - name: Run bats tests
        run: bats scripts/playlist-ingest/tests/

  # The bundled scripts are distributed to macOS users, where /bin/bash is
  # 3.2.57 (Apple froze it at the last GPLv2 release). The Ubuntu job above
  # runs bash 5, so it cannot see bash-4-only constructs; a dev Mac cannot
  # either, because Homebrew's bash 5 satisfies `#!/usr/bin/env bash`. Neither
  # oracle covered the combination that actually fails, which is how `mapfile`
  # shipped and broke `ytt ingest` outright on a stock Mac.
  scripts-bash32:
    name: bats under macOS /bin/bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # coreutils supplies gtimeout. Without it, with_timeout() in the scripts
      # silently degrades to running with NO timeout, so the run watchdog never
      # fires — the test for it fails, which is the correct outcome: a macOS box
      # lacking coreutils genuinely has no watchdog. The formula declares
      # coreutils for the same reason.
      - name: Install bats and coreutils
        run: brew install bats-core coreutils
      - name: Confirm /bin/bash really is 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash -c 'echo "${BASH_VERSINFO[0]}"' | grep -qx 3 \
            || { echo "::error::/bin/bash is not 3.x; this job would not test what it claims"; exit 1; }
      - name: Syntax-check under bash 3.2
        run: |
          for f in scripts/playlist-ingest/*.sh; do /bin/bash -n "$f"; done
      # Shim `bash` to /bin/bash so `#!/usr/bin/env bash` in the scripts and
      # mocks resolves to 3.2 rather than whatever Homebrew has installed.
      - name: Run bats with bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          PATH="$RUNNER_TEMP/bash32:$PATH" bash --version | head -1
          PATH="$RUNNER_TEMP/bash32:$PATH" bats scripts/playlist-ingest/tests/
