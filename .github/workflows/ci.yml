name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[test]"

      - name: --version
        run: |
          out="$(ytt --version)"
          echo "$out"
          [[ "$out" == ytt* ]]

      - name: --help
        run: ytt --help

      - name: --help-agent
        run: |
          out="$(ytt --help-agent)"
          echo "$out" | head -3
          [[ "$out" == *"ytt"* && "$out" == *"Exit codes"* ]]

      - name: no-args exits 2
        run: |
          set +e
          ytt
          rc=$?
          set -e
          [[ $rc -eq 2 ]]

      - name: pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check artefacts
        run: |
          pip install twine
          twine check dist/*

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/playlist-ingest/ingest.sh
          bash -n scripts/playlist-ingest/ingest-one.sh
          bash -n scripts/playlist-ingest/build-index.sh
      - name: Run bats tests
        run: bats scripts/playlist-ingest/tests/
