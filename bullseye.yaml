  T18:
    name: 'Download and analysis are independent ingest stages: paced fetch whenever the laptop is online, unthrottled synopsis of anything already downloaded'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'ingest-one.sh --download writes transcript+meta only; --analyze synopses without YouTube fetch or throttle; synopsis/capacity failure keeps the download (bats 7, 10, 11, 12, 13). Orphan sweep skips complete downloads (bats 58). ytt ingest --download batches (default 16) and does not treat hopper remainder as failure (bats 61). ytt ingest --analyze scans disk and skips discovery (bats 60). Default ingest is two fan-outs. Launchd: youtube-ingest StartInterval 1200 --download RunAtLoad; youtube-analyze StartInterval 600 --analyze RunAtLoad; both bootstrapped (state running). GOWORK=off go test ./... ok; bats 62/62.'
    acceptance:
    - ingest-one.sh --download writes transcript.json + meta.json, does not call ytt synopsis, and does not append .processed
    - ingest-one.sh --analyze writes the synopsis and appends .processed, does not fetch YouTube, and does not throttle
    - A synopsis/capacity failure leaves the downloaded transcript+meta on disk and does not append .processed
    - Orphan sweep deletes only incomplete downloads (missing transcript or meta); a complete download waiting for analysis is kept
    - ytt ingest --download discovers and paced-fetches a bounded batch; leftover hopper IDs are not reported as failures
    - ytt ingest --analyze scans the tree for downloaded-but-unanalyzed IDs and synopses them with no YouTube pacing
    - Default ytt ingest runs download then analyze as two fan-outs (download of video N does not wait on synopsis of video N)
    - 'Two launchd jobs: a frequent StartInterval download tick and a separate analyze tick; the old once-daily combined job is unloaded'
    - bats cover download-only, analyze-only, synopsis-failure keeps download, orphan-preserves-pending, and download batch remainder is not a failure
    context: |-
      Coupled ingest made every video pay 3–7 min YouTube pacing PLUS a Claudia synopsis (often grok/claude empty → Codex) under a 6h watchdog. The 20–21 Aug run landed 62 then reported 9197 'failed' because the rest of the 9k hopper was still queued. Download is the only step that must be throttled and only needs the laptop online; analysis can drain whatever is already on disk, independently, without YouTube pacing.

      Achieved 2026-08-21: ingest-one.sh --download writes transcript+meta only; --analyze synopses without YouTube fetch or throttle; synopsis/capacity failure keeps the download (bats 7, 10, 11, 12, 13). Orphan sweep skips complete downloads (bats 58). ytt ingest --download batches (default 16) and does not treat hopper remainder as failure (bats 61). ytt ingest --analyze scans disk and skips discovery (bats 60). Default ingest is two fan-outs. Launchd: youtube-ingest StartInterval 1200 --download RunAtLoad; youtube-analyze StartInterval 600 --analyze RunAtLoad; both bootstrapped (state running). GOWORK=off go test ./... ok; bats 62/62.
    tags:
    - ingest
    origin: manual
    discovered: 2026-08-21
    achieved: 2026-08-21
  T19:
    name: Undownloadable IDs are recorded once and skipped; analyze never deletes in-flight downloads
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Permanent ytt/meta failures append $ROOT/.download-failed and are skipped on later ticks. A tick whose failures are all newly recorded undownloadable IDs is not UNHEALTHY (bats: undownloadable ids are recorded once; first-tick exit 0). --analyze does not orphan-sweep (bats: leaves a fresh incomplete dir). Download-stage sweep age-gates at YOUTUBE_INGEST_ORPHAN_MIN (default 60; tests set 0). ingest-one mkdir -p before each fetch attempt. Live ledger seeded with 18 repeating poison IDs (members-only / no transcript). GOWORK=off go test ./... ok; bats 64/64.'
