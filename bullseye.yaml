# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server, and safe
# to hand-edit (the targets live below).
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit the
# targets, not these lines.
schema_version: 5
targets:
  T1:
    name: Playlist-ingest is a complete, end-to-end workflow installable via `brew install ytt`
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - From a clean `brew install marcelocantos/tap/ytt`, a user can run the playlist-ingest workflow against a real YouTube playlist with no further package installs (yt-dlp, jq, etc. come in via the formula's `depends_on`)
    - The playlist-ingest entry script is discoverable — either symlinked onto PATH (e.g. `ytt-ingest`) or fronted by a `ytt ingest` subcommand — without needing to know the libexec path
    - 'README documents the playlist-ingest workflow: required env vars (`YOUTUBE_INGEST_PLAYLIST`, `YOUTUBE_INGEST_ROOT`, `YOUTUBE_CHANNELS_FILE`), how to invoke, and what lands on disk'
    - 'Demonstration: a clean install on a throwaway shell environment runs the workflow against a small playlist and produces transcript+metadata files under `$YOUTUBE_INGEST_ROOT`'
    context: |-
      Decomposition of the starter milestone into a concrete first user-visible capability for ytt. Background: v0.4.0 (released 2026-04-something) shipped the playlist-ingest companion scripts under `scripts/playlist-ingest/`, bundled into the formula via `libexec.install Dir["*"]`, but only `ytt` itself is symlinked onto PATH. The scripts also rely on `yt-dlp` and `jq` which the formula does not declare. Net effect: a clean Homebrew install cannot run the playlist-ingest workflow without (a) manual brew installs of yt-dlp/jq, and (b) digging into the libexec directory. The milestone closes that gap so that playlist ingestion is a first-class, demo-able feature.

      Sub-targets:
      - 🎯T2 — Homebrew deps (yt-dlp, jq) declared on the formula
      - 🎯T1.1 — playlist-ingest entry point is discoverable (PATH symlink or `ytt ingest` subcommand)
      - 🎯T1.2 — README documents the playlist-ingest workflow

      Out of scope for this milestone: ingesting a single video via a `ytt ingest <video-id>` subcommand (covered by `ingest-one.sh` separately), Obsidian/`.processed` schema changes, the broader "channel-ingest as a service" direction.
    depends_on:
    - T2
    - T1.1
    - T1.2
    origin: bullseye_init
    discovered: 2026-04-27
    achieved: 2026-04-29
  T1.1:
    name: Playlist-ingest entry script is discoverable on a clean install (PATH symlink or `ytt ingest` subcommand)
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - After `brew install marcelocantos/tap/ytt`, the user can launch the playlist-ingest workflow without referencing `$(brew --prefix)/libexec/ytt/scripts/...`
    - 'Either: (a) the formula adds a `bin.install_symlink` entry (e.g. `ytt-ingest -> libexec/scripts/playlist-ingest/ingest.sh`), or (b) `ytt.py` grows an `ingest` subcommand that locates and execs the bundled script'
    - Decision recorded in commit message and/or audit log noting which approach was chosen and why
    - '`--help` (or `ytt --help` if subcommand path) advertises the ingest entry point so it''s discoverable'
    context: |-
      The bundled `scripts/playlist-ingest/ingest.sh` is the user-facing entry point of the ingest workflow. **Architectural finding (2026-04-28):** the brew-shipped artifact is a PyInstaller `--onedir` bundle (`dist/ytt/ytt` + `dist/ytt/_internal/`), and the release.yml tarball step (`tar -C dist/ytt -czf ... .`) does NOT include the `scripts/` directory. So the scripts are not present in a brew install at all — the audit-log assumption that "they're bundled but not surfaced" was wrong. The platform-specific URL blocks in the formula short-circuit the source tarball; only the binary tarball is downloaded.

      Decision: go with the **`ytt ingest` subcommand** approach AND extend the release pipeline to copy `scripts/` into `dist/ytt/scripts/` before tarring.

      Runtime path resolution in `ytt.py`:
      - Frozen (PyInstaller): `Path(sys.executable).resolve().parent / "scripts" / "playlist-ingest" / "ingest.sh"`
      - Source/dev: `Path(__file__).resolve().parent / "scripts" / "playlist-ingest" / "ingest.sh"`

      Subcommand handling: detect `argv[1] == "ingest"` *before* argparse (so the rest passes through verbatim), then `os.execvp("bash", ["bash", str(script_path), *argv[2:]])`.
    origin: decomposition of T1
    discovered: 2026-04-28
    achieved: 2026-04-29
  T1.2:
    name: README documents the playlist-ingest workflow
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - README has a `## Playlist ingest` (or similar) section describing what the workflow does and what state it produces on disk
    - 'Documents required and optional env vars: `YOUTUBE_INGEST_PLAYLIST`, `YOUTUBE_INGEST_ROOT` (default `~/think/knowledge/youtube`), `YOUTUBE_CHANNELS_FILE`, `YOUTUBE_INGEST_CONCURRENCY`'
    - 'Includes a minimal copy-pasteable example: set env, run the entry command, see results'
    - Mentions runtime deps (`yt-dlp`, `jq`) but notes they come in via Homebrew automatically; calls out `claude` (npm) as required for `ingest-one.sh` if/when that's surfaced
    - Cross-references the entry-point decision from 🎯T1.1 (i.e. uses whichever invocation form ships)
    context: |-
      The README currently documents only the `ytt` transcript CLI. Playlist ingest is invisible to anyone discovering ytt through Homebrew or the GitHub release page. This sub-target closes that gap so the milestone-level "first-class workflow" claim is actually true for users.

      Order this after 🎯T1.1 lands so the docs reference the final invocation form rather than getting rewritten.
    depends_on:
    - T1.1
    origin: decomposition of T1
    discovered: 2026-04-28
    achieved: 2026-04-29
  T10:
    name: A truncated channel-feed walk cannot advance a cursor past unseen videos
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - A feed fetch that fails after emitting partial output either discards the partial discovery or bounds the cursor advance so nothing between the old cursor and the truncation point is skipped
    - A bats test simulates a feed emitting N IDs then failing, and asserts no unseen video is permanently skipped
    context: 'Pre-existing hazard found in the PR-15 review (finding 6): walked>0 with a non-zero feed rc is treated as a complete discovery. Low probability (walk depth is usually 1-3, single API page) but same failure family as the outage — partial failure read as success. Fix trades against the --lazy-playlist early-exit optimisation; needs a design decision, not a hotfix.'
    origin: manual
    discovered: 2026-07-04
    achieved: 2026-07-04
  T11:
    name: An unhealthy scheduled ingest reaches the operator out-of-band, and a pipeline that stops producing is treated as a failure
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Every unhealthy outcome (preflight abort, discovery failure, orphaned config, per-video failure, watchdog expiry, spend limit, index-refresh failure) routes through a single exit path that both fails the run and emits an alert — no failure mode can be added that fails silently.
    - Alerts deliver to Slack as a direct message via chat.postMessage with a bot token read from a mode-600 file outside the repo, with an incoming webhook as a fallback sink and a macOS banner when neither is configured.
    - Slack's response body is parsed rather than trusting the HTTP status, since chat.postMessage returns 200 with ok:false for bad tokens and missing scopes.
    - A notification failure never changes the run's exit status.
    - Repeat alerts are deduplicated by problem digest, re-alerting only after a configurable window, and a single RECOVERED notice is sent when the problem clears.
    - A liveness check fails the run when nothing has been ingested for YOUTUBE_INGEST_STALE_DAYS while channels are tracked, so 'every step succeeded and yet no knowledge arrived' is detectable without a human noticing.
    - '`ytt ingest --dry-run` reports resolved config and the would-be queue without fetching, spending, or alerting.'
    - bats coverage for all of the above passes on both macOS and the Ubuntu CI runner.
    - Delivery is verified end-to-end with a real message, not only against mocks.
    context: 'Filed 2026-07-26 after the second 🎯T7.1 regression. The pipeline had accumulated 18 PRs of hardening — per-call timeouts, a run watchdog, network gating, orphan sweeps, cursor-invariant repair, non-zero exits on partial batches — and still lost 15 days of channel ingest without anyone noticing. Every one of those checks answers "did this step fail?"; none answered "is this thing still producing anything?", and the one signal that did fire (launchd''s exit code) had no reader. Two structural conclusions: (1) exit codes are not monitoring — something must actively push a message to a human; (2) a scheduled pipeline needs at least one check that fires on a NON-event, because the silent-success failure mode is invisible to per-step checks by construction.'
    origin: manual
    discovered: 2026-07-26
    achieved: 2026-07-26
  T12:
    name: The bundled ingest scripts run on a stock macOS /bin/bash (3.2), or declare their bash requirement
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - scripts/playlist-ingest/*.sh contain no bash 4+ constructs (mapfile/readarray/declare -A), or the Homebrew formula declares depends_on "bash" so a modern bash is guaranteed on PATH.
    - A macOS CI job exercises the bats suite under /bin/bash 3.2, so the incompatibility cannot silently return.
    - '`ytt ingest --dry-run` runs to completion on a Mac whose only bash is /bin/bash 3.2.'
    context: Found during the v0.10.0 release audit (2026-07-26). ingest.sh uses `mapfile` in 4 places, which is bash 4+; macOS has shipped bash 3.2.57 since Apple froze it at the last GPLv2 release. The bug is invisible on this machine because Homebrew's bash 5.x satisfies `#!/usr/bin/env bash`, and invisible in CI because the bats job runs on Ubuntu while the macOS release job only runs PyInstaller — so no oracle currently covers the combination that would fail. Pre-existing, not introduced by v0.10.0. notify.sh (added in v0.10.0) was checked and is 3.2-clean.
    origin: manual
    discovered: 2026-07-26
  T13:
    name: Alert delivery does not silently downgrade because of how the run was invoked
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The Slack DM target resolves from $YOUTUBE_INGEST_SLACK_DM, else from $XDG_CONFIG_HOME/ytt/slack-dm, so a configured DM sink works regardless of the invoking environment.
    - When a bot token is present but no DM target can be resolved, notify.sh says so explicitly rather than falling through to the banner with only a subtle log difference.
    - The macOS banner carries the failure detail, not just the subject line, and its click action opens the ingest log when terminal-notifier is available (osascript notifications have no click handler and no surviving process, so their Show button is inert by construction).
    - 'bats coverage for: DM target read from the config file, the loud warning when a token exists with no target, and banner delivery via both terminal-notifier and the osascript fallback.'
    context: |-
      Found immediately after the v0.10.0 release (2026-07-26) by the backlog drain, which is the best possible way to find it: the run ended 47-ingested/4-failed, correctly judged itself unhealthy, and alerted — but emitted only `notify: banner shown`, no DM. Cause: the DM target is env-only, and the manual invocation did not pass YOUTUBE_INGEST_SLACK_DM. The scheduled run is unaffected because the plist sets it, so nightly alerting works.

      This is the same defect class as the bug the release fixes: required configuration living somewhere invocation-dependent, degrading silently instead of complaining. The token sits in ~/.config/ytt/slack-token but its companion target does not, so the pair can only be half-configured. Storing the target beside the token makes the sink self-contained, and a loud warning when a token has no target removes the silent-downgrade path entirely.
    origin: manual
    discovered: 2026-07-26
    achieved: 2026-07-26
  T2:
    name: Homebrew formula declares yt-dlp, jq, and yq as runtime deps so the bundled playlist-ingest scripts work on a clean install
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Formula at `~/work/github.com/marcelocantos/homebrew-tap/Formula/ytt.rb` declares `depends_on "yt-dlp"`, `depends_on "jq"`, and `depends_on "yq"`
    - Running `ytt ingest` from a clean `brew install ytt` works without manual `brew install yt-dlp jq yq` steps
    - homebrew-releaser config in ytt's `.github/workflows/release.yml` is updated so the next release auto-regenerates the formula with the depends_on lines
    - If/when scripts are surfaced via additional `bin.install_symlink` entries (currently `ytt` is the only symlink — the `ingest` subcommand routes via the bundled scripts/), the deps are already in place
    context: |-
      Background: ytt is a CLI (no `service do` block, no launchd PATH bug). The `ytt.py` binary itself is clean — no subprocess calls. The dependency gap is in the bundled bash scripts.

      Audit findings for ytt (from ~/think investigation 2026-04-27):
      - `ytt.py` — no subprocess calls. ✅
      - `scripts/playlist-ingest/ingest.sh` — uses `yt-dlp` (brew), `jq` (brew)
      - `scripts/playlist-ingest/ingest-one.sh` — uses `yt-dlp`, `jq`, `ytt` (self), `claude` (npm, NOT in brew)
      - `scripts/playlist-ingest/build-index.sh` — uses `jq`, plus `awk`/`sed` (system)

      Formula state (verified 2026-04-27): no `depends_on`. The formula does `libexec.install Dir["*"]` (bundles everything including the scripts) then `bin.install_symlink libexec/"ytt"` (only exposes `ytt` on PATH). So scripts are bundled but not surfaced.

      Even though the scripts aren't directly on PATH, users who invoke them via `$(brew --prefix)/libexec/ytt/scripts/playlist-ingest/...` (or via internal calls from `ytt`) need yt-dlp and jq installed. Declaring `depends_on` makes `brew install ytt` self-sufficient regardless of how the scripts get invoked.

      Tools NOT in Homebrew, kept as expectations: `claude` (npm global). Documenting in caveats is optional; users running playlist ingest will already have it.

      Formula additions:
      ```ruby
      depends_on "yt-dlp"
      depends_on "jq"
      ```

      Sibling targets exist on mnemo (🎯T47), sawmill (🎯T33), vellum (🎯T8), pageflip (🎯T32), jevons (🎯T19) covering the broader homebrew-tap dependency-audit initiative.
    origin: forked-from spyder PATH-bug investigation in ~/think on 2026-04-27 (homebrew-tap-wide audit)
    discovered: 2026-04-27
    achieved: 2026-04-29
  T3:
    name: ytt --json ships in a released, Homebrew-installed build
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - add-json-output branch (--json payload persistence + random 3–7 min request pacing) is merged to master
    - A new minor release (v0.6.0) is cut with --json; CI builds the release binaries
    - homebrew-tap Formula/ytt.rb is bumped to the release and `brew upgrade ytt` installs a --json-capable ytt at /opt/homebrew/bin/ytt
    - The ~/.local/bin/ytt → ~/.py/bin/ytt stopgap symlink is removed and the daily launchd ingest still resolves a --json-capable ytt
    context: 'The playlist/channel ingest (scripts/playlist-ingest/ingest-one.sh) calls `ytt --json`, but the Homebrew-installed release 0.5.0 on the launchd PATH lacks --json (the feature lives only on the unmerged add-json-output branch, also tagged 0.5.0 as a dev build at ~/.py/bin/ytt). Every daily run failed with "unrecognized arguments: --json". Stopgapped on 2026-06-15 by symlinking ~/.local/bin/ytt → ~/.py/bin/ytt (launchd PATH checks .local/bin first). This target tracks doing the proper release so the stopgap can be removed.'
