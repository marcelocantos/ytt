  T4:
    name: Ingest aborts early when the Claude synopsis step hits the monthly spend limit
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 2.0
    acceptance:
    - ingest-one.sh distinguishes a Claude spend/usage-limit synopsis failure ("monthly spend limit"/usage-limit signal) from transient errors
    - On a spend-limit signal the run stops dispatching further videos instead of paced-fetching every remaining transcript only to fail each synopsis (~2h wasted per run)
    - A distinct log line records that the run aborted on the spend limit, and the partially-built video dir is cleaned up
    - Already-paced/landed videos in the same run are unaffected
    context: The 2026-06-15 backlog drain ingested 7/27, then hit the Claude monthly spend limit; the remaining 20 each paced-fetched a transcript (3-7 min apart, ~2h total) only to fail at the `claude -p` synopsis step with \"You've hit your monthly spend limit\". Detecting that signal and aborting the run early avoids hours of pointless paced YouTube fetching until the budget resets or is raised. Pacing, ordering, and --json all worked correctly; this is purely a wasted-effort guard.
    origin: manual
    discovered: 2026-06-16
    achieved: 2026-06-21
  T5:
    name: Scheduled ingest survives network-unavailable fire times and never mistakes a failed discovery for "nothing new"
    status: achieved
    value: 4.0
    cost: 1.0
    actual_cost: 1.0
    acceptance:
    - The run waits (bounded) for connectivity before discovery, so a launchd tick that fires in a DarkWake window with no Wi-Fi defers instead of running blind
    - A failed playlist enumeration or channel feed fetch is logged as FAILED and counted; it is never reported as "playlist=0" / "nothing new"
    - A fetch failure while bootstrapping a cursor-less channel skips that channel only — it does not abort the whole run (the set -e command-substitution death)
    - A "nothing to do" run with discovery failures exits non-zero so launchd's last-exit-code reflects the truth
    - The playlist argument must be an http(s) URL; -h/--help prints usage instead of becoming the playlist (the --help incident queued 851 lines of yt-dlp usage text as video IDs)
    - Queued IDs are validated against the YouTube ID charset before fan-out; junk is dropped loudly
    context: 'Between 2026-06-28 and 2026-07-02 every 06:30 launchd run fired while the laptop slept: launchd defers the calendar tick to the next wake, usually a DarkWake maintenance window with no Wi-Fi association, so every DNS lookup failed. The playlist logged "playlist=0 pending=0" and channels logged "nothing new" — discovery failure was indistinguishable from no-new-content. Adding the cursor-less @t3dotgg channel on 2026-07-01 upgraded the blindness to a hard crash: its bootstrap `latest=$(yt-dlp ...)` assignment under set -e killed the run on fetch failure. Separately, `ingest.sh --help` (run 2026-07-01) treated "--help" as the playlist URL and queued yt-dlp''s usage text as video IDs.'
    origin: manual
    discovered: 2026-07-02
    achieved: 2026-07-02
  T6:
    name: 'The ingest scripts apply the PR-15 review hardening: strict ID validation at both layers, dated logs, curl preflight, fail-loud rc fallback, narrowed synopsis CWD'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The fan-out queue filter requires ^[A-Za-z0-9_-]{11}$ (real YouTube ID shape); test fixtures updated to 11-char IDs
    - ingest-one.sh validates its ID argument against the same pattern before any mkdir or rm -rf touches $ROOT/$ID
    - log() timestamps in ingest.sh and ingest-one.sh include the date (ISO 8601), so multi-day failure windows are diagnosable from the log alone
    - ingest.sh fails fast with a distinct message when curl is absent (today exit-127 loops in the network gate for 4h looking like a network outage)
    - The feed_rc missing-file fallback defaults to failure, not success
    - The claude -p synopsis step runs with CWD set to the video dir, shrinking the prompt-injection write surface to $DIR
    context: 'Findings 1-5 of the Fable 5 code review of PR #15 (2026-07-03). The charset-only ID filter was a deliberate concession to readable test fixtures; this target pays that debt properly.'
    origin: manual
    discovered: 2026-07-04
    achieved: 2026-07-04
  T7:
    name: Nightly ingest runs as a crosshair strategy; the bespoke launchd plist is retired
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A bullseye target with a strategy block (freshness check + ingest.sh as the strategy) drives the nightly ingest via crosshair's tick loop
    - com.marcelocantos.youtube-ingest.plist is unloaded and deleted; all scheduling config lives in version control
    - Run history (last attempt, last success, consecutive failures, backoff state) is queryable from crosshair's store
    - Ingest logs move out of the git-tracked content tree (no more auto-sync log-noise commits in ~/think)
    - The pipeline pins which ytt binary it invokes, eliminating the shell-vs-launchd binary identity skew
    context: 'BLOCKED on a crosshair capability that does not exist in v0.1.0: crosshair''s tick loop runs any non-terminal strategy target EVERY tick (needs_attempt = !status.is_terminal()); the strategy `trigger` field (e.g. "cron:30 6 * * *") is parsed but never honored. Pointing ingest.sh at a strategy today would run YouTube discovery every tick — the exact burst pattern the pacing design prevents. Fixing T7 cleanly requires crosshair to honor scheduled triggers first (tracked as a target in the crosshair repo, 2026-07-04). The crosshair-independent slice — version-controlling the plist, pinning the ytt binary to kill the shell-vs-launchd skew, and relocating logs out of the git tree — is split into 🎯T7.1 and delivered now. Revisit the crosshair migration once crosshair honors triggers.'
    origin: manual
    discovered: 2026-07-04
  T7.1:
    name: The launchd scheduler is version-controlled, pins the ytt binary, and keeps logs out of the git-tracked content tree
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The scheduler plist is committed in the ytt repo (not just a live artifact on one machine).
    - The scheduled runner pins and preflights both its ytt and Claude executables before discovery, eliminating shell-vs-launchd binary identity skew and missing-CLI worker failures.
    - Any incomplete run—failed video worker, incomplete discovery, run watchdog expiry, or index-refresh failure—exits non-zero so scheduler state is not falsely green.
    - The scheduled runner writes its logs outside ~/think via YOUTUBE_INGEST_LOG + plist StandardOutPath, and stray content-tree logs are gitignored, so ingest no longer produces auto-sync noise commits.
    - The live plist is updated to the released binary and verified to load.
    - 'Pinning the binary does not orphan user config: the channels file resolves from $XDG_CONFIG_HOME/ytt/ before the install prefix, and the plist pins YOUTUBE_CHANNELS_FILE to a path outside the Cellar.'
    context: |-
      The crosshair-independent slice of 🎯T7 (see its blocker note). Directly closes two whole-product review findings — binary-identity skew (behind the June --json outage) and content-tree log churn — without retiring the working launchd scheduler.

      Reverted 2026-07-10: Regression verified 2026-07-10: the version-controlled live plist omits /Users/marcelo/.local/bin from PATH, so every scheduled synopsis call fails to resolve Claude. The runner also exits 0 after worker failures, hiding the outage from launchd. Restore an explicit Claude binary contract and fail the run when queued items do not land.

      Second regression, 2026-07-26: pinning the runner to the INSTALLED binary (the fix for the skew above) silently orphaned the channel config. ingest.sh resolved channels.yaml as $HERE/channels.yaml, and $HERE became /opt/homebrew/Cellar/ytt/0.9.0/libexec/scripts/playlist-ingest/ — a package-managed directory that never contains the gitignored channels.yaml and is replaced on every upgrade. From 2026-07-10 to 07-26, 15 consecutive scheduled runs logged "playlist=21 pending=0 / no channels file / nothing to do" and exited 0 while six tracked channels (51 pending videos on discovery) went entirely unfetched. The lesson generalises beyond this bug: pinning an executable also repins every path derived from that executable's location, so config resolution must be anchored independently. Config now resolves user-config-first, and a missing channels file is a hard failure whenever .channels/&lt;handle&gt; cursors prove channels were previously working. Alerting is 🎯T11.
    origin: manual
    discovered: 2026-07-04
    achieved: 2026-07-26
