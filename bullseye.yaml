  T17:
    name: Synopses are generated through Claudia with Grok then Claude then Codex fallback
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: "ingest-one.sh calls `ytt synopsis` (not claude -p). Default ladder grok,claude,codex via YOUTUBE_INGEST_SYNOPSIS_PROVIDERS. Host writes slug.md from the model reply. Capacity on one provider falls through; all-available-capacity returns 255 (bats spend-limit abort + Go TestCmdSynopsisCapacityExit255). Hermetic Go tests: first-provider wins, grok-capacity\to claude, all-capacity, skip-missing, empty-reply-tries-next, cmd writes file. bats 55/55; GOWORK=off go test ./... ok. Live plist has GROK_BIN+CLAUDE_BIN, no YOUTUBE_INGEST_CLAUDE_BIN. Residual: Grok Task still cannot honour DisallowTools (claudia T23 fail-closed); untrusted-transcript writes rely on stdout + CWD. No live Grok spend in CI — hermetic ladder is the oracle."
    acceptance:
    - ingest-one.sh invokes `ytt synopsis` (Claudia Task mode), not `claude -p`
    - Default provider ladder is grok then claude then codex; YOUTUBE_INGEST_SYNOPSIS_PROVIDERS can override
    - A capacity/spend/rate-limit failure on one provider falls through to the next; the run aborts with exit 255 only when every available provider is capacity-limited
    - A non-capacity failure on the last available provider fails that video (exit 1) and does not abort the rest of the queue
    - The host writes `<slug>.md` from the model reply; the agent is instructed not to write files
    - 'Hermetic Go tests cover: first provider success, grok capacity then claude success, all-capacity → 255, empty/malformed reply → try next'
    - bats ingest-one happy path, spend-limit abort, and synopsis-failure cleanup still pass
    - Scheduled plist no longer requires YOUTUBE_INGEST_CLAUDE_BIN
    context: "Nightly ingest dies on Claude's monthly spend cap after ~30 videos while ~9k Takeout IDs sit in the backfill hopper (2026-08-16/18/19). Claudia already wraps Grok, Claude, and Codex Task mode. Route synopses through Claudia with Grok first so SuperGrok carries the default load, Claude then Codex absorb capacity failures, and a Claude-only spend limit no longer reds the whole run.\n\nAchieved 2026-08-19: ingest-one.sh calls `ytt synopsis` (not claude -p). Default ladder grok,claude,codex via YOUTUBE_INGEST_SYNOPSIS_PROVIDERS. Host writes slug.md from the model reply. Capacity on one provider falls through; all-available-capacity returns 255 (bats spend-limit abort + Go TestCmdSynopsisCapacityExit255). Hermetic Go tests: first-provider wins, grok-capacity\to claude, all-capacity, skip-missing, empty-reply-tries-next, cmd writes file. bats 55/55; GOWORK=off go test ./... ok. Live plist has GROK_BIN+CLAUDE_BIN, no YOUTUBE_INGEST_CLAUDE_BIN. Residual: Grok Task still cannot honour DisallowTools (claudia T23 fail-closed); untrusted-transcript writes rely on stdout + CWD. No live Grok spend in CI — hermetic ladder is the oracle."
